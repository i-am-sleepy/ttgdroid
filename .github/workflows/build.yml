name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sources
        run: |
          mkdir _src
          if [ -f project.zip ]; then unzip -q project.zip -d _src; else rsync -a --exclude _src --exclude .git ./ _src/; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: _src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OBB-Tool-apk
          path: _src/app/build/outputs/apk/debug/app-debug.apk
